<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>

<form onsubmit="convertir(); return false;">
    <input type="number" id="celsius" required>
    <button type="submit">Convertir</button>
</form>

<p id="resultado"></p>

<script>
function convertir() {
    var c = document.getElementById("celsius").value;
    var f = c * 9/5 + 32;
    document.getElementById("resultado").innerText = c + " Celsius = " + f + " Fahrenheit";
}
</script>

</body>
</html>
